name: Build shapez.io

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Root Dependencies
        run: yarn install --ignore-scripts

      - name: Install Gulp Dependencies
        run: |
          cd gulp
          yarn install

      - name: Build Application Files
        run: |
          cd gulp
          # 型チェックを通さず、atlas生成とファイルアセンブリのみ直接実行する
          npx gulp createAtlas || true
          npx gulp buildHtml || true
          npx gulp buildResources || true
          npx gulp buildJS || true
          npx gulp buildCss || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shapez-build
          path: build/
