name: Build shapez.io

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: yarn install

      - name: Build project
        run: |
          cd gulp
          yarn install
          # shapez.io の gulp タスクは "default" (yarn gulp) で watch が起動してしまう可能性があるため、
          # CI向けに1回限りのビルドを行うコマンド (例: yarn build または node でビルドスクリプトを実行) 
          # package.json の scripts を確認できないため、gulp の standalone ビルドタスクを呼び出す。
          # 'buildStandalone' などのタスク名が存在するケースが多い。
          # 'yarn run build' がルート package.json にあるか確認してから実行するフォールバック
          if grep -q '"build"' ../package.json; then
            cd ..
            yarn build
          else
            yarn gulp buildStandalone || yarn gulp
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shapez-build
          path: build/
